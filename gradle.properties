# The development version. A release takes its version from the tag (v0.1.0 -> 0.1.0), passed
# as -Pversion, so this is never edited for a release.
version=0.0.0-SNAPSHOT

# The SinewSlim libraries built against. A local build with ../SinewSlim checked out uses that
# checkout instead, whatever this says. On a release, bumped to the version SinewSlim has just
# put on Central (DESIGN.md, Release: SinewSlim first, then this repository).
sinewslimVersion=0.0.0-SNAPSHOT
