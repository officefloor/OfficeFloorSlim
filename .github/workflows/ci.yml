name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No SinewSlim checkout beside it: its libraries come from Maven Central at sinewslimVersion
      # (gradle.properties), as in a release and a user's build. A local build with ../SinewSlim
      # checked out builds against that instead (DESIGN.md, Local development).
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew --console=plain build :intellij:buildPlugin
