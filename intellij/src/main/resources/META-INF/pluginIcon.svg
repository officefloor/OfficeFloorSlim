    <rect x="4.5" y="4.5" width="71" height="71" rx="2.5" fill="#BBE0FF" stroke="#4FAFFF" stroke-width="1.5"/>
    <g fill="#008BFF" stroke="#4FAFFF" stroke-width="1">
      <rect x="10" y="9.5" width="30" height="26" rx="2"/>
      <rect x="45" y="9.5" width="25" height="31" rx="2"/>
      <rect x="10" y="39.5" width="26" height="32.5" rx="2"/>
      <rect x="40" y="44.5" width="30" height="27.5" rx="2"/>
    </g>
