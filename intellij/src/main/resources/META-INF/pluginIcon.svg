  <defs>
    <mask id="rooms">
      <rect x="0" y="0" width="80" height="80" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="16" y="16" width="18" height="13" rx="1.5"/>
        <rect x="51" y="16" width="13" height="18" rx="1.5"/>
        <rect x="16" y="46" width="13" height="18" rx="1.5"/>
        <rect x="46" y="51" width="18" height="13" rx="1.5"/>
